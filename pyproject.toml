[project]
name = "aiwork"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "typer", "tzdata"]

[project.optional-dependencies]
# The panel's /pty terminal: ConPTY on Windows, a POSIX pty elsewhere.
panel = [
    "pywinpty; sys_platform == 'win32'",
    "ptyprocess; sys_platform != 'win32'",
]
dev = [
    "pytest",
    "websockets",
    "pywinpty; sys_platform == 'win32'",
    "ptyprocess; sys_platform != 'win32'",
]

[project.scripts]
aiwork = "aiwork.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwork"]

[tool.hatch.build.targets.wheel.force-include]
"src/aiwork/public_prices.json" = "aiwork/public_prices.json"
"src/aiwork/resources/dispatch-rules.md" = "aiwork/resources/dispatch-rules.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
